<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HVAC card browser checks</title>
<style>
  body { background: #111; color: #ddd; font: 14px Arial, sans-serif; margin: 16px; }
  #fixture { display: block; width: 320px; max-width: 100%; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import '../hvac-card.js';

  // Stand-ins keep Home Assistant's card and icon geometry for standalone checks.
  customElements.define('ha-card', class extends HTMLElement {
    connectedCallback() {
      this.style.cssText = 'display:block;background:#1c1c1c;border:1px solid #333;border-radius:12px';
    }
  });
  customElements.define('ha-icon', class extends HTMLElement {
    connectedCallback() {
      this.style.cssText = 'display:inline-block;width:24px;height:24px;font-size:24px;line-height:24px;text-align:center';
      this.textContent = this.getAttribute('icon').includes('speedometer') ? '◴' : '✣';
    }
  });

  const readings = {
    'sensor.recuperace_outdoor_air_temperature': '7.1',
    'sensor.recuperace_supply_fan_spreed_rpm': '3433.9',
    'sensor.recuperace_exhaust_air_temperature': '0.0',
    'sensor.recuperace_extract_fan_spreed_rpm': '3353',
    'sensor.recuperace_extract_air_temperature': '21.9',
    'sensor.recuperace_current_extract_air_flow_m3_h': '208.9',
    'sensor.recuperace_supply_air_temperature': '21.0',
    'sensor.recuperace_current_supply_air_flow_m3_h': '160'
  };
  const states = Object.fromEntries(Object.entries({
    ...readings,
    'sensor.recuperace_current_system_state': 'Comfort',
    'select.recuperace_current_system_mode': 'Comfort',
    'sensor.recuperace_filters_timer_days_left': '30',
    'sensor.recuperace_bypass_position': '0',
    'sensor.recuperace_preater_control_output': '0',
    'select.recuperace_winter_summer_mode': 'Winter'
  }).map(([entityId, state]) => [entityId, { state, attributes: { friendly_name: entityId } }]));
  const fixture = document.querySelector('#fixture');
  const card = document.createElement('hvac-card');
  card.setConfig({ type: 'custom:hvac-card' });
  card.hass = { states };
  fixture.attachShadow({ mode: 'open' }).append(card);
  const events = [];
  document.addEventListener('hass-more-info', event => events.push(event));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };

  try {
    await card.updateComplete;
    const diagram = card.shadowRoot.querySelector('svg.airflow-diagram');
    assert(diagram && diagram.querySelectorAll('path').length === 6, 'Airflow diagram must render inline');
    assert(getComputedStyle(card.shadowRoot.querySelector('.bg')).backgroundImage === 'none', 'Diagram must not depend on an external background image');
    const buttons = [...card.shadowRoot.querySelectorAll('button.reading:not(.mode-state)')];
    assert(buttons.length === 8, 'All eight readings must be buttons');
    buttons.forEach((button, index) => {
      button.click();
      assert(events.length === index + 1, 'Click must reach the document exactly once');
      const event = events[index];
      assert(event.detail.entityId === Object.keys(readings)[index], 'Wrong entity for reading');
      assert(event.bubbles && event.composed, 'Event must cross Home Assistant shadow roots');
      assert(button.getAttribute('aria-label').includes(button.title), 'Reading needs an accessible name');
    });
    assert(buttons[1].textContent.includes('3433 rpm'), 'RPM should remain truncated');
    assert(buttons[5].textContent.includes('208m³/h'), 'Air flow should remain truncated');
    const modeButton = card.shadowRoot.querySelector('button.mode-state');
    assert(modeButton && modeButton.getAttribute('aria-haspopup') === 'dialog', 'Mode must be a dialog button');
    modeButton.click();
    assert(events.length === 9, 'Mode click must reach the document exactly once');
    assert(events.at(-1).detail.entityId === 'select.recuperace_current_system_mode', 'Mode must open the select, not the system state sensor');

    for (const mode of ['Comfort', 'Building protection']) {
      states['sensor.recuperace_current_system_state'] = { state: mode };
      card.hass = { states };
      await card.updateComplete;
      assert(modeButton.textContent.trim() === mode, 'Reported operating state must still update');
      for (const width of [280, 320, 360, 375, 400, 600, 800]) {
        fixture.style.maxWidth = 'none';
        fixture.style.width = `${width}px`;
        await new Promise(requestAnimationFrame);
        const bounds = card.getBoundingClientRect();
        const diagramBounds = diagram.getBoundingClientRect();
        assert(diagramBounds.width > 0 && diagramBounds.height > 0, 'Diagram must be visible');
        assert(diagramBounds.left >= bounds.left && diagramBounds.right <= bounds.right, `Diagram overflows at ${width}px`);
        const nodes = [...buttons, modeButton];
        const rects = nodes.map(node => node.getBoundingClientRect());
        assert(card.shadowRoot.querySelector('ha-card').offsetWidth <= width, `Card overflows at ${width}px`);
        rects.forEach((rect, index) => {
          assert(rect.left >= bounds.left && rect.right <= bounds.right, `Reading ${index} overflows at ${width}px`);
          assert(rect.height >= 44, 'Touch targets must be at least 44px tall');
          rects.slice(index + 1).forEach(other => {
            const overlaps = rect.left < other.right && rect.right > other.left && rect.top < other.bottom && rect.bottom > other.top;
            assert(!overlaps, `Readings overlap at ${width}px (${mode})`);
          });
        });
      }
    }
    states['sensor.recuperace_outdoor_air_temperature'].state = '-12.5';
    states['sensor.recuperace_supply_fan_spreed_rpm'].state = 'unavailable';
    states['sensor.recuperace_current_system_state'].state = 'Comfort';
    card.hass = { states };
    await card.updateComplete;
    assert(buttons[0].textContent.includes('-12.5°C'), 'Live temperatures must update');
    assert(buttons[1].textContent.includes('unavailable'), 'Unavailable RPM must not become NaN');
    buttons[0].click();
    assert(events.at(-1).detail.entityId === Object.keys(readings)[0], 'Entity must stay correct after update');
    states['sensor.recuperace_supply_fan_spreed_rpm'].state = '3433';
    card.hass = { states };

    const customIds = {
      outdoor_temperature: 'sensor.other_outdoor',
      exhaust_temperature: 'sensor.other_exhaust',
      extract_temperature: 'sensor.other_extract',
      supply_temperature: 'sensor.other_supply',
      supply_fan_rpm: 'sensor.other_supply_rpm',
      extract_fan_rpm: 'sensor.other_extract_rpm',
      extract_air_flow: 'sensor.other_extract_flow',
      supply_air_flow: 'sensor.other_supply_flow',
      system_state: 'sensor.other_state',
      system_mode: 'select.other_mode',
      filter_days_left: 'sensor.other_filter',
      bypass_position: 'sensor.other_bypass',
      preheater_output: 'sensor.other_preheater',
      winter_summer_mode: 'select.other_season'
    };
    const customValues = {
      outdoor_temperature: '-3.2', exhaust_temperature: '4.5',
      extract_temperature: '23.4', supply_temperature: '18.6',
      supply_fan_rpm: '1200.9', extract_fan_rpm: '1300.1',
      extract_air_flow: '98.7', supply_air_flow: '123.4',
      system_state: 'Boost', system_mode: 'Economy', filter_days_left: '3',
      bypass_position: '100', preheater_output: '35', winter_summer_mode: 'Summer'
    };
    const customStates = Object.fromEntries(Object.entries(customIds).map(([key, id]) => [id, {
      state: customValues[key], attributes: { friendly_name: key }
    }]));
    const Card = card.constructor;
    const form = Card.getConfigForm();
    assert(form.schema.length === 14, 'Visual editor must expose all 14 entity roles');
    for (const field of form.schema) {
      assert(field.name in customIds && field.selector.entity, 'Editor must use entity selectors');
      assert(form.computeLabel(field) && form.computeHelper(field), 'Every editor field needs a label and default hint');
    }
    const defaults = Card.getStubConfig();
    defaults.system_mode = 'select.changed';
    assert(Card.getStubConfig().system_mode === 'select.recuperace_current_system_mode', 'Defaults must not be shared mutable config');

    const customConfig = { type: 'custom:hvac-card', ...customIds, grid_options: { columns: 6 } };
    form.assertConfig(customConfig);
    card.setConfig(customConfig);
    card.hass = { states: customStates };
    await card.updateComplete;
    assert(card.config.grid_options.columns === 6, 'Dashboard options must survive entity configuration');
    assert(customConfig.system_mode === customIds.system_mode, 'Input configuration must not be mutated');
    const readingKeys = ['outdoor_temperature', 'supply_fan_rpm', 'exhaust_temperature', 'extract_fan_rpm', 'extract_temperature', 'extract_air_flow', 'supply_temperature', 'supply_air_flow'];
    const expectedReadings = ['-3.2°C', '1200 rpm', '4.5°C', '1300 rpm', '23.4°C', '98m³/h', '18.6°C', '123m³/h'];
    buttons.forEach((button, index) => {
      assert(button.textContent.includes(expectedReadings[index]), `Custom reading ${index} uses the wrong sensor`);
      button.click();
      assert(events.at(-1).detail.entityId === customIds[readingKeys[index]], 'Reading history must use configured entity');
    });
    assert(modeButton.textContent.trim() === 'Boost', 'Heading must use the configured reported state');
    modeButton.click();
    assert(events.at(-1).detail.entityId === customIds.system_mode, 'Mode click must use configured select');
    assert(card.shadowRoot.querySelector('.spin').getAttribute('icon') === 'mdi:fan-speed-2', 'Fan speed icon must use configured mode');
    const indicators = [...card.shadowRoot.querySelectorAll('.info-row ha-icon')];
    assert(!indicators[0].classList.contains('inactive'), 'Fan indicator must use configured mode');
    assert(indicators[1].classList.contains('warning'), 'Filter warning must use configured days remaining');
    assert(indicators[2].getAttribute('icon') === 'mdi:shuffle-disabled', 'Bypass must use configured position');
    assert(!indicators[3].classList.contains('inactive'), 'Preheater must use configured output');
    assert(indicators[4].getAttribute('icon') === 'mdi:weather-sunny', 'Season icon must use configured season');

    card.setConfig({ ...customConfig, system_mode: 'input_select.replacement_mode' });
    card.hass = { states: { 'input_select.replacement_mode': { state: 'Auto', attributes: {} } } };
    await card.updateComplete;
    assert(modeButton.textContent.trim() === 'Auto', 'Missing reported state must fall back to selected mode');
    modeButton.click();
    assert(events.at(-1).detail.entityId === 'input_select.replacement_mode', 'Changed config must replace the click target');
    assert(card.shadowRoot.querySelector('.spin').getAttribute('icon') === 'mdi:fan', 'Other mode names need a valid generic icon');
    buttons.forEach(button => assert(button.disabled && button.getAttribute('aria-label') === `${button.title}: —`, 'Missing sensors must show disabled placeholders'));

    card.hass = { states: {} };
    await card.updateComplete;
    assert(modeButton.disabled && modeButton.textContent.trim() === '—', 'Missing mode must be disabled');
    assert(!card.shadowRoot.querySelector('.spin'), 'Missing mode must not show a running fan');
    const beforeMissingClick = events.length;
    [...buttons, modeButton].forEach(button => button.click());
    assert(events.length === beforeMissingClick, 'Missing entities must not open dialogs');
    assert([...card.shadowRoot.querySelectorAll('.info-row ha-icon')].every(icon => icon.classList.contains('inactive')), 'Missing status entities must not appear active');

    card.setConfig({ type: 'custom:hvac-card', outdoor_temperature: customIds.outdoor_temperature });
    card.hass = { states: { ...states, ...customStates } };
    await card.updateComplete;
    assert(buttons[0].textContent.includes('-3.2°C') && buttons[1].textContent.includes('3433 rpm'), 'Partial config must retain other defaults');
    for (const empty of ['', null]) {
      card.setConfig({ type: 'custom:hvac-card', outdoor_temperature: empty });
      await card.updateComplete;
      assert(buttons[0].textContent.includes('-12.5°C'), 'Clearing a field must restore its default');
    }
    for (const invalid of [null, [], { system_mode: [] }, { outdoor_temperature: 42 }, { system_mode: 'not_an_entity' }]) {
      for (const validate of [config => card.setConfig(config), form.assertConfig]) {
        let rejected = false;
        try { validate(invalid); } catch (error) { rejected = true; }
        assert(rejected, 'Malformed config must be rejected by both card and editor');
      }
    }
    card.setConfig({ type: 'custom:hvac-card' });
    card.hass = { states };
    await card.updateComplete;
    assert(!performance.getEntriesByType('resource').some(resource => resource.name.includes('hvac_heat.png')), 'Card must not request the old PNG');
    document.querySelector('#result').textContent = 'PASS: configurable entities, editor schema, defaults, missing entities, validation, inline SVG, entity events, live updates, and layout at 280–800px.\nClick a reading or operating state to inspect its entity below.';
    document.addEventListener('hass-more-info', event => {
      document.querySelector('#result').textContent = `hass-more-info: ${event.detail.entityId}`;
    });
  } catch (error) {
    document.querySelector('#result').textContent = `FAIL: ${error.message}`;
    throw error;
  } finally {
    fixture.style.width = '320px';
    fixture.style.maxWidth = '100%';
  }
</script>
